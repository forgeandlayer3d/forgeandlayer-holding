<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge & Layer 3D | Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1115;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
        }
        .logo-container {
            margin-bottom: 1.5rem;
        }
        .logo {
            max-width: 200px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.05));
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        p {
            color: #9ca3af;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #0f1115;
            text-decoration: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            background-color: #f9fafb;
        }
        .footer {
            margin-top: 5rem;
            font-size: 0.85rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Visual Coming Soon Tag -->
        <div class="badge">Coming Soon</div>

        <!-- Links directly to your existing logo.png in the repository -->
        <div class="logo-container">
            <img src="logo.png" alt="Forge & Layer 3D Logo" class="logo">
        </div>
        
        <h1>Forge & Layer 3D</h1>
        <p>We are currently shaping something incredible.</p>
        
        <!-- Replace the old <a> link with this script -->
<script>
    // Splits your email so bots scanning raw HTML text cannot read it
    var user = "forgeandlayer3d";
    var domain = "gmail.com";
    
    // Dynamically builds the clickable button onto the page
    document.write('<a href="mailto:' + user + '@' + domain + '" class="btn">Get in Touch</a>');
</script>

        
        <div class="footer">
            &copy; 2026 Forge & Layer 3D. All rights reserved.
        </div>
    </div>

</body>
</html>
